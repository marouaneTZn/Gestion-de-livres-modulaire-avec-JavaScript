<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Book Manager</title>
  </head>
  <body>
    <header class="flex items-center bg-amber-100 mx-auto px-8 py-4">
      <div class="flex items-center mx-auto gap-3">
        <img
          src="assets/website-LOGO.svg"
          alt="Book Tracker logo"
          class="w-10 h-10"
        />
        <p class="text-xl font-bold text-amber-950">Marouane's Book Tracker</p>
      </div>
    </header>
    <main class="p-3.5">
      <section
        class="min-h-[400px] bg-[linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),url('./assets/Library.jpg')] bg-cover bg-center flex flex-col items-center justify-center text-white text-center px-4"
      >
        <h1 class="text-4xl md:text-5xl font-bold mb-4">
          Your Personal Library
        </h1>
        <p class="text-lg md:text-xl">
          Keep every book and reading journey organized.
        </p>

        <div
          class="grid sm:grid-cols-3 grid-cols-1 gap-5 my-10 max-w-5xl mx-auto px-4"
        >
          <div
            class="bg-amber-100 border border-amber-200 rounded-2xl p-6 shadow-sm"
          >
            <div class="text-4xl">📚</div>
            <h3 class="text-amber-800 font-semibold">Total Books</h3>
            <p id="total-books" class="text-4xl font-bold text-amber-950 mt-2">
              0
            </p>
          </div>

          <div
            class="bg-green-100 border border-green-200 rounded-2xl p-6 shadow-sm"
          >
            <div class="text-4xl">📖</div>
            <h3 class="text-green-800 font-semibold">Currently Reading</h3>
            <p
              id="reading-books"
              class="text-4xl font-bold text-green-950 mt-2"
            >
              0
            </p>
          </div>

          <div
            class="bg-orange-100 border border-orange-200 rounded-2xl p-6 shadow-sm"
          >
            <div class="text-4xl">✅</div>
            <h3 class="text-orange-800 font-semibold">Finished Books</h3>
            <p
              id="finished-books"
              class="text-4xl font-bold text-orange-950 mt-2"
            >
              0
            </p>
          </div>
        </div>
      </section>

      <div class="flex flex-col gap-3 w-full max-w-xl mx-auto mt-6 px-2">
        <div class="flex relative">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-amber-700"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m21 21-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"
            />
          </svg>

          <input
            type="search"
            id="search-input"
            placeholder="Search books by title or author..."
            aria-label="Search books"
            class="w-full pl-12 pr-4 py-3 bg-white border border-amber-200 rounded-xl shadow-sm text-gray-800 placeholder:text-gray-400 outline-none focus:border-amber-600 focus:ring-2 focus:ring-amber-200 transition-all duration-200"
          />
        </div>

        <div class="grid gap-1.5 grid-cols-[2fr_1fr]">
          <select
            id="sort-select"
            aria-label="Sort books"
            class="bg-white border border-amber-200 text-amber-950 rounded-xl px-4 py-3 shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-200 cursor-pointer"
          >
            <option value="title">Title</option>
            <option value="author">Author</option>
            <option value="year">Publication Year</option>
          </select>
          <button
            id="add-book-btn"
            type="button"
            class="bg-amber-950 hover:bg-amber-800 shadow-sm rounded-xl text-amber-50 px-4 py-3 font-semibold cursor-pointer transition-colors"
          >
            + Add Books
          </button>
        </div>
        <section class="max-w-5xl mt-10 px-4 mx-auto">
          <h2 class="text-2xl font-bold text-amber-950">My Book Collection</h2>
          <div id="books-container"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
